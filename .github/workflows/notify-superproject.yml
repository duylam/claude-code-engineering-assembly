name: Notify superproject on push to main

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Emit repo_dispatch to superproject
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_GITHUB_TOKEN }}
          SUPER_REPO: ${{ vars.SUPER_PROJECT_REPO_NAME }}
        run: |
          payload=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg sha  "${{ github.sha }}" \
            --arg ref  "${{ github.ref }}" \
            '{"event_type":"submodule-updated","client_payload":{"repo":$repo,"sha":$sha,"ref":$ref}}')

          echo "$payload" | gh api repos/$SUPER_REPO/dispatches \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --input -
